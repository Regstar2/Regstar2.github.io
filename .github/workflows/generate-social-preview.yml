name: Generate social preview

on:
  push:
    branches:
      - feature/site-polish
    paths:
      - .github/workflows/generate-social-preview.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-polish

      - name: Generate preview
        shell: bash
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont

          W, H = 1200, 630
          img = Image.new('RGB', (W, H), '#090A12')
          draw = ImageDraw.Draw(img)

          for x in range(0, W, 48):
              draw.line((x, 0, x, H), fill='#0E101B', width=1)
          for y in range(0, H, 48):
              draw.line((0, y, W, y), fill='#0E101B', width=1)

          draw.rounded_rectangle((60, 55, 1140, 575), radius=36, fill='#111322', outline='#262B49', width=2)
          draw.rounded_rectangle((905, 110, 1085, 290), radius=42, fill='#5C3A9E')

          bold = '/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          regular = '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          mono = '/usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf'

          label = ImageFont.truetype(mono, 28)
          title = ImageFont.truetype(bold, 100)
          subtitle = ImageFont.truetype(regular, 38)
          focus = ImageFont.truetype(mono, 24)
          monogram = ImageFont.truetype(bold, 112)

          draw.text((120, 125), '> profile', font=label, fill='#7DFFB3')
          draw.text((120, 190), 'Regstar', font=title, fill='#F6F6FF')
          draw.text((120, 330), 'Software Engineering student · AI-assisted developer', font=subtitle, fill='#C9CBEA')
          draw.text((120, 410), 'Desktop · Android · Networking · Utilities', font=focus, fill='#A3A6C5')

          box = draw.textbbox((0, 0), 'R', font=monogram)
          rw, rh = box[2] - box[0], box[3] - box[1]
          draw.text((995 - rw / 2, 200 - rh / 2 - 8), 'R', font=monogram, fill='#FFFFFF')

          img.save('assets/social-preview.png', 'PNG', optimize=True)
          PY

      - name: Commit preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/social-preview.png
          git commit -m "Add social preview image"
          git push origin HEAD:feature/site-polish
