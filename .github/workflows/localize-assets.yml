name: Localize website assets

on:
  push:
    branches:
      - feature/site-polish
    paths:
      - .github/workflows/localize-assets.yml

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/site-polish

      - name: Download assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/profile assets/projects assets/stack

          curl -fsSL "https://raw.githubusercontent.com/Regstar2/Regstar2/main/assets/silly-kitty-aka-me.jpg" -o assets/profile/cat.jpg
          curl -fsSL "https://raw.githubusercontent.com/Regstar2/dns-switcher/main/assets/app-dark.ico" -o assets/projects/dns-switcher.ico
          curl -fsSL "https://raw.githubusercontent.com/Regstar2/white-list-checker/main/scripts/assets/ic_launcher_source.png" -o assets/projects/white-list-checker.png
          curl -fsSL "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/docker/docker-original.svg" -o assets/projects/wdtt-gateway.svg
          curl -fsSL "https://raw.githubusercontent.com/Regstar2/tg-ws-proxy-android/main/icon.png" -o assets/projects/tg-ws-proxy-android.png
          curl -fsSL "https://raw.githubusercontent.com/Regstar2/windows-iso-builder/master/src/WindowsISOBuilder.Gui/Assets/WindowsISOBuilder.png" -o assets/projects/windows-iso-builder.png
          curl -fsSL "https://raw.githubusercontent.com/Regstar2/music-ark/main/docs/assets/logo.png" -o assets/projects/music-ark.png

          curl -fsSL "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/python/python-original.svg" -o assets/stack/python.svg
          curl -fsSL "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/java/java-original.svg" -o assets/stack/java.svg
          curl -fsSL "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/csharp/csharp-original.svg" -o assets/stack/csharp.svg
          curl -fsSL "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/go/go-original-wordmark.svg" -o assets/stack/go.svg
          curl -fsSL "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/kotlin/kotlin-original.svg" -o assets/stack/kotlin.svg
          curl -fsSL "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/dot-net/dot-net-original.svg" -o assets/stack/dotnet.svg
          curl -fsSL "https://cdn.simpleicons.org/android/3DDC84" -o assets/stack/android.svg
          curl -fsSL "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/docker/docker-plain.svg" -o assets/stack/docker.svg
          curl -fsSL "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/vscode/vscode-original.svg" -o assets/stack/vscode.svg
          curl -fsSL "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/git/git-original.svg" -o assets/stack/git.svg
          curl -fsSL "https://cdn.jsdelivr.net/gh/devicons/devicon@latest/icons/powershell/powershell-original.svg" -o assets/stack/powershell.svg

      - name: Commit assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile assets/projects assets/stack
          git commit -m "Localize website assets"
          git push origin HEAD:feature/site-polish
